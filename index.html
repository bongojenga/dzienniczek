<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Głowa</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1b1b1a;--muted:#6b6a66;--line:#e3e1db;--line2:#b9b7ae;--chip:#eeede8;--accent:#2a78d6;--accent-bg:#e3eefb;--danger:#c93a3a;--danger-bg:#fbe9e9;--warn-bg:#fcf1d9;--warn:#8a5a00;--ok:#1f7a3a;
--s1:#2a78d6;--s2:#eb6834;--h1:#f6c9b1;--h2:#ee9a72;--h3:#d95926;--h4:#9b3814;--sel:#d95926;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--text:#f0efec;--muted:#a9a89f;--line:#34332f;--line2:#5c5b55;--chip:#2c2b28;--accent:#5c9ded;--accent-bg:#1d2d44;--danger:#ef7070;--danger-bg:#3a1f1f;--warn-bg:#3a2e14;--warn:#f1c46b;--ok:#5fcf7f;
--s1:#3987e5;--s2:#d95926;--h1:#5a2610;--h2:#93391a;--h3:#d2582a;--h4:#f39a6e;--sel:#e0663a;color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:1.0625rem/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body,button,input,textarea,select,a,svg{touch-action:pan-x pan-y}
.changelog h3{margin:0.75rem 0 0.25rem}
.changelog ul{margin:0 0 0.5rem;padding-left:1.25rem}
.changelog li{margin:0.2rem 0}
.changelog details{margin:0.5rem 0}
.changelog summary{cursor:pointer}
.fontrow{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;margin:0.25rem 0 0.5rem}
body{padding:env(safe-area-inset-top) 0 calc(4.875rem + env(safe-area-inset-bottom))}
main{max-width:35rem;margin:0 auto;padding:0.75rem 0.875rem 1.5rem}
h1{font-size:1.625rem;margin:0.5rem 0 2px;font-weight:650}
h2{font-size:1.1875rem;margin:0 0 0.5rem;font-weight:600}
h3{font-size:1rem;margin:0 0 0.5rem;font-weight:600}
p{margin:0.375rem 0}
.hint{color:var(--muted);font-size:0.875rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:0.875rem;padding:0.875rem;margin:0.75rem 0}
.blk{background:var(--card);border:1px solid var(--line);border-radius:0.875rem;padding:0.875rem;margin:0.75rem 0}
details.more{padding:0}
details.more>summary{padding:0.875rem;font-weight:600;cursor:pointer;list-style:none}
details.more>summary::after{content:"▾";float:right;color:var(--muted)}
details.more[open]>summary::after{content:"▴"}
details.more .blk{border:0;border-top:1px solid var(--line);border-radius:0;margin:0}
button{font:inherit;color:inherit}
.btn{display:block;width:100%;border:0;border-radius:0.875rem;padding:1rem;font-size:1.125rem;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn.big{padding:1.625rem 1rem;font-size:1.375rem;background:var(--danger);margin:0.875rem 0}
.btn.sec{background:var(--chip);color:var(--text)}
.btn.small{padding:0.6875rem;font-size:1rem}
.row{display:flex;gap:0.625rem}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:0.5rem}
.chip{border:1px solid transparent;background:var(--chip);border-radius:62.4375rem;padding:0.5625rem 0.875rem;font-size:0.9375rem;cursor:pointer;min-height:2.5rem}
.chip.on{background:var(--accent);color:#fff}
.chip.red.on{background:var(--danger)}
.chip.ghost{background:transparent;border-color:var(--line2)}
input[type=datetime-local],input[type=date],input[type=time],input[type=number],input[type=text],textarea,select{font:inherit;font-size:1.0625rem;width:100%;padding:0.6875rem 0.75rem;border:1px solid var(--line2);border-radius:0.625rem;background:var(--card);color:var(--text)}
textarea{min-height:5.25rem;resize:vertical}
input[type=datetime-local],input[type=date],input[type=time]{min-height:2.875rem;-webkit-appearance:none;appearance:none}
.sl{position:relative;padding:0.375rem 0 2px}
.sl input[type=range]{width:100%;height:2.25rem;margin:0;-webkit-appearance:none;appearance:none;background:transparent;touch-action:none}
.sl input[type=range]::-webkit-slider-runnable-track{height:0.5rem;border-radius:0.25rem;background:linear-gradient(90deg,var(--h1),var(--h3),var(--h4))}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2rem;height:2rem;margin-top:-12px;border-radius:50%;background:var(--card);border:3px solid var(--text)}
.sl.unset input[type=range]::-webkit-slider-thumb{border-color:var(--line2);background:var(--chip)}
.sl input[type=range]::-moz-range-track{height:0.5rem;border-radius:0.25rem;background:linear-gradient(90deg,var(--h1),var(--h3),var(--h4))}
.sl input[type=range]::-moz-range-thumb{width:1.75rem;height:1.75rem;border-radius:50%;background:var(--card);border:3px solid var(--text)}
.sl.neutral input[type=range]::-webkit-slider-runnable-track{background:var(--line2)}
.scale{display:flex;justify-content:space-between;font-size:0.8125rem;color:var(--muted)}
.val{font-size:1.75rem;font-weight:700;float:right;line-height:1}
.val small{font-size:0.875rem;font-weight:500;color:var(--muted)}
.err{color:var(--danger);font-size:0.875rem;margin-top:0.375rem}
.stepper{display:flex;align-items:center;gap:0.75rem}
.stepper button{width:3rem;height:3rem;border-radius:0.75rem;border:0;background:var(--chip);font-size:1.5rem;cursor:pointer}
.stepper span{min-width:3.5rem;text-align:center;font-size:1.375rem;font-weight:600}
.field{margin:0.75rem 0 0.25rem}
.field>label{display:block;font-size:0.875rem;color:var(--muted);margin-bottom:0.375rem}
.med{border:1px solid var(--line);border-radius:0.75rem;padding:0.625rem 0.75rem;margin:0.5rem 0}
.med .top{display:flex;justify-content:space-between;gap:0.5rem;align-items:start}
.med .x{border:0;background:transparent;color:var(--muted);font-size:0.875rem;cursor:pointer;padding:0.25rem}
.panel{border:2px solid var(--accent);border-radius:0.75rem;padding:0.75rem;margin-top:0.5rem}
.banner{border-radius:0.75rem;padding:0.75rem 0.875rem;margin:0.75rem 0;font-size:0.9375rem}
.banner.red{background:var(--danger-bg);color:var(--danger);font-weight:600}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--accent-bg)}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:0.625rem 0.875rem calc(0.625rem + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.savebar .in{max-width:35rem;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;border:0;background:transparent;padding:0.625rem 0 0.75rem;font-size:0.8125rem;color:var(--muted);cursor:pointer}
.tabs button b{display:block;font-size:1.25rem;line-height:1.1;font-weight:500}
.tabs button.on{color:var(--accent);font-weight:600}
.top{display:flex;align-items:center;gap:0.5rem}
.back{border:0;background:transparent;color:var(--accent);font-size:1.0625rem;padding:0.5rem 0;cursor:pointer}
.status{font-size:0.8125rem;color:var(--muted);margin:2px 0 0.375rem}
.status.bad{color:var(--danger)}
.ep{display:flex;gap:0.75rem;align-items:center;padding:0.75rem 0;border-top:1px solid var(--line);cursor:pointer}
.ep:first-child{border-top:0}
.pill{min-width:2.75rem;height:2.75rem;border-radius:0.625rem;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.125rem}
.ep .t{flex:1}
.ep .t small{display:block;color:var(--muted);font-size:0.875rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem;margin:0.75rem 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:0.875rem;padding:0.75rem}
.tile .n{font-size:1.625rem;font-weight:700}
.tile .l{font-size:0.8125rem;color:var(--muted)}
.bar{height:0.625rem;border-radius:0.3125rem;background:var(--chip);overflow:hidden;margin:0.25rem 0 0.625rem}
.bar>i{display:block;height:100%;border-radius:0.3125rem;background:var(--s1)}
.bar.hot>i{background:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:0.375rem 0.875rem;font-size:0.8125rem;color:var(--muted);margin:0.25rem 0 0.375rem}
.legend i{display:inline-block;width:0.6875rem;height:0.6875rem;border-radius:3px;margin-right:0.3125rem;vertical-align:-1px}
.tip{font-size:0.875rem;min-height:1.25rem;color:var(--text);margin-top:0.25rem}
svg text{font-size:12px;fill:var(--muted)}
svg.head text{font-size:22px}
.r{fill:var(--card);stroke:var(--line2);stroke-width:1}
.r.i{cursor:pointer}
.r.on{fill:var(--sel)}
.np{pointer-events:none}
table{width:100%;border-collapse:collapse;font-size:0.875rem}
td,th{padding:0.4375rem 0.25rem;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:0.8125rem;border-top:0}
td.num,th.num{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.75rem + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:0.625rem 1.125rem;border-radius:62.4375rem;font-size:0.9375rem;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.link{border:0;background:transparent;color:var(--accent);padding:0;font-size:0.9375rem;cursor:pointer;text-decoration:underline}
.danger-link{color:var(--danger)}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="home"><b>●</b>Start</button>

  <button data-tab="more"><b>⋯</b>Więcej</button>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
var WERSJA_APP = '1.4';
var ZMIANY = [
  ['1.4', '23.11.2026', ['Wyłączone przybliżanie ekranu dwoma palcami (do powiększania jest przełącznik wielkości tekstu).', 'Nowa sekcja „Historia zmian” w zakładce Więcej.']],
  ['1.3', '23.11.2026', ['Przełącznik wielkości tekstu (normalny, duży, bardzo duży) na ekranie Start i w zakładce Więcej.', 'Wyłączone przybliżanie ekranu podwójnym stuknięciem.', 'Sekcja „Więcej szczegółów” jest od razu rozwinięta.', '„Aura przed bólem?”: można zaznaczyć kilka rodzajów; „Brak” odznacza pozostałe.']],
  ['1.2', '23.11.2026', ['Nowy objaw „Stały ból” w sekcji Objawy (u obu osób).', '„Gorzej przy ruchu” zmienione na „Nasila się przy ruchu”.']],
  ['1.1', '17.11.2026', ['„Jaki to ból?”: można zaznaczyć kilka cech naraz.', 'Kawa i herbata liczone osobno.', 'Godzinę ostatniej kawy lub herbaty można wyczyścić; bez napojów godzina nie jest zapisywana.', 'Skrypt arkusza: naprawiony błąd instalacji (za mało kolumn) i automatyczne dodawanie nowych kolumn.']],
  ['1.0', '17.11.2026', ['Pierwsza wersja: wpis bólu z mapą głowy, natężeniem i objawami.', 'Leki z listy z dawką, oceną po 2 godzinach i licznikiem dni z lekami.', 'Pomiary ciśnienia, zmiany leczenia, historia i statystyki.', 'Pogoda i ciśnienie atmosferyczne, praca bez internetu.']]
];
// Blokada przybliżania gestem (Safari na iPhonie bywa uparte, więc kilka zabezpieczeń naraz)
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });

// ------------------------------------------------------------ narzędzia
var SKALE = [1, 1.2, 1.4];
function applySkala() { var i = 0; try { i = Number(localStorage.getItem('skala')) || 0; } catch (e) {} document.documentElement.style.fontSize = (16 * (SKALE[i] || 1)) + 'px'; return i; }
applySkala();
function skalaHtml() {
  var cur = applySkala();
  return '<div class="fontrow"><span class="hint">Wielkość tekstu</span><div class="chips" style="flex-wrap:nowrap;gap:8px">' + SKALE.map(function (v, i) {
    return '<button class="chip' + (i === cur ? ' on' : '') + '" data-act="skala" data-v="' + i + '" aria-label="' + ['Tekst normalny', 'Tekst duży', 'Tekst bardzo duży'][i] + '" style="font-size:' + [15, 19, 24][i] + 'px;width:46px;height:46px;min-height:0;padding:0;font-weight:600">A</button>';
  }).join('') + '</div></div>';
}
var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function pad(n) { return String(n).padStart(2, '0'); }
var TZ = (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } })();
function localStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function inputVal(s) { return String(s || '').replace(' ', 'T').slice(0, 16); }
function fromLocal(s) {
  var m = String(s || '').match(/(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) : null;
}
function epStart(e) { var d = e.start_utc ? new Date(e.start_utc) : fromLocal(e.start_lokalny); return d && !isNaN(d) ? d : null; }
function epEnd(e) { if (!e.koniec_lokalny) return null; var d = e.koniec_utc ? new Date(e.koniec_utc) : fromLocal(e.koniec_lokalny); return d && !isNaN(d) ? d : null; }
function todayKey() { return localStr(new Date()).slice(0, 10); }
function addDays(key, n) { var p = key.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)); return d.toISOString().slice(0, 10); }
var DNI = ['nd', 'pn', 'wt', 'śr', 'cz', 'pt', 'sb'];
var MIES = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];
function dow(key) { var p = key.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(); }
function fmtDay(key) { var p = key.split('-'); return DNI[dow(key)] + ' ' + (+p[2]) + '.' + p[1]; }
function hhmm(s) { return String(s || '').slice(11, 16); }
function num(v) { return v === '' || v === null || v === undefined || isNaN(Number(v)) ? null : Number(v); }
function fmtDur(h) {
  if (h === null || h === undefined || isNaN(h)) return '';
  var m = Math.round(h * 60);
  if (m < 60) return m + ' min';
  var hh = Math.floor(m / 60), mm = m % 60;
  return hh + ' h' + (mm ? ' ' + mm + ' min' : '');
}
function fmtNum(v) { return String(Math.round(v * 10) / 10).replace('.', ','); }
function doseTxt(d, unit) {
  var n = Number(d);
  var t = n === 0.5 ? '½' : (n === 1.5 ? '1½' : String(n).replace('.', ','));
  return t + ' ' + (unit || '');
}
function natColor(n) {
  if (n === null) return 'var(--chip)';
  if (n <= 3) return 'var(--h1)';
  if (n <= 6) return 'var(--h2)';
  if (n <= 8) return 'var(--h3)';
  return 'var(--h4)';
}
function natInk(n) { return n !== null && n >= 7 ? '#fff' : 'var(--text)'; }
function natWord(n) {
  if (n === null) return 'dotknij suwaka';
  if (n === 0) return 'brak bólu';
  if (n <= 3) return 'łagodny';
  if (n <= 6) return 'umiarkowany';
  if (n <= 9) return 'silny';
  return 'najgorszy możliwy';
}
var toastT;
function toast(t) { var el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 2200); }

// ------------------------------------------------------------ konfiguracja i dane
function decodeCfg(s) {
  try {
    var m = String(s).match(/c=([A-Za-z0-9_\-=]+)/);
    var code = (m ? m[1] : String(s)).trim().replace(/-/g, '+').replace(/_/g, '/');
    while (code.length % 4) code += '=';
    var j = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (j && j.a && j.k) return { a: j.a, k: j.k };
  } catch (e) {}
  return null;
}
var cfg = decodeCfg(location.hash) || LS.get('cfg', null);
if (cfg) LS.set('cfg', cfg);
var cache = LS.get('cache', null);
var outbox = LS.get('outbox', []);
var sync = { busy: false, ok: null, err: null };
var view = { name: cfg ? 'home' : 'setup' };

function prof() { return cache && cache.osoba && cache.osoba.profil === 'ojciec' ? 'ojciec' : 'syn'; }
function lekiDorazne() { return ((cache && cache.leki) || []).filter(function (l) { return l.rola === 'doraźny'; }); }
function lekById(id) { return ((cache && cache.leki) || []).filter(function (l) { return l.id_leku === id; })[0]; }

function applyLocal(op) {
  if (!cache) return;
  var d = op.data;
  function upsert(arr, obj) { var i = arr.findIndex(function (x) { return x.id === obj.id; }); if (i >= 0) arr[i] = obj; else arr.push(obj); }
  function remove(arr, id) { var i = arr.findIndex(function (x) { return x.id === id; }); if (i >= 0) arr.splice(i, 1); }
  if (op.type === 'saveEpisode') upsert(cache.epizody, JSON.parse(JSON.stringify(d)));
  if (op.type === 'deleteEpisode') remove(cache.epizody, d.id);
  if (op.type === 'saveBp') upsert(cache.cisnienie, JSON.parse(JSON.stringify(d)));
  if (op.type === 'deleteBp') remove(cache.cisnienie, d.id);
  if (op.type === 'saveEvent') upsert(cache.zmiany, JSON.parse(JSON.stringify(d)));
  if (op.type === 'deleteEvent') remove(cache.zmiany, d.id);
}
function queue(type, data) {
  var op = { opId: uuid(), type: type, data: data };
  outbox.push(op);
  LS.set('outbox', outbox);
  applyLocal(op);
  LS.set('cache', cache);
  doSync();
}
function doSync() {
  if (!cfg || sync.busy) return;
  sync.busy = true;
  renderStatus();
  var ops = outbox.slice();
  fetch(cfg.a, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: cfg.k, ops: ops }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.error || 'błąd serwera');
      var sent = {};
      ops.forEach(function (o) { sent[o.opId] = true; });
      outbox = outbox.filter(function (o) { return !sent[o.opId]; });
      LS.set('outbox', outbox);
      cache = { osoba: j.osoba, leki: j.leki || [], epizody: j.epizody || [], cisnienie: j.cisnienie || [], zmiany: j.zmiany || [], ts: Date.now() };
      outbox.forEach(applyLocal);
      LS.set('cache', cache);
      var bledy = (j.wyniki || []).filter(function (w) { return !w.ok; });
      sync.ok = Date.now();
      sync.err = bledy.length ? ('Arkusz odrzucił wpis: ' + bledy[0].error) : null;
    })
    .catch(function (e) {
      sync.err = navigator.onLine === false ? 'Brak internetu. Wpisy czekają w telefonie i wyślą się same.' : ('Nie udało się połączyć z arkuszem (' + e.message + '). Wpisy czekają w telefonie.');

function bindSliders() {
  $$('.sl').forEach(function (w) {
    if (w._b) return;
    w._b = true;
    var inp = $('input', w);
    function setFromX(x) {
      var r = inp.getBoundingClientRect();
      var v = Math.round(Math.max(0, Math.min(1, (x - r.left - 14) / (r.width - 28))) * 10);
      inp.value = v;
      sliderChanged(w.dataset.sl, v, w);
    }
    var down = false;
    inp.addEventListener('input', function () { sliderChanged(w.dataset.sl, Number(inp.value), w); });
    inp.addEventListener('pointerdown', function (e) { down = true; e.preventDefault(); try { inp.setPointerCapture(e.pointerId); } catch (x) {} setFromX(e.clientX); });
    inp.addEventListener('pointermove', function (e) { if (down) setFromX(e.clientX); });
    inp.addEventListener('pointerup', function () { down = false; });
    inp.addEventListener('pointercancel', function () { down = false; });
  });
}
function sliderChanged(key, v, w) {
  w.classList.remove('unset');
  if (key === 'natezenie_max') {
    F.ep.natezenie_max = v;
    $('#natv').innerHTML = v + ' <small>' + natWord(v) + '</small>';
    var e = $('#natErr'); if (e) e.hidden = true;
  } else if (key === 'stres') {
    F.ep.stres = v; $('#stresv').textContent = v;
  } else if (key === 'med_nat' && F.med) {
    F.med.nat = v; $('#mednatv').textContent = v;
  } else if (key === 'close_nat' && C) {
    C.ep.natezenie_max = v; $('#closenatv').textContent = v;
  }
  saveDraft();
}

function saveEpisode() {
  var ep = F.ep;
  if (num(ep.natezenie_max) === null) {
    var e = $('#natErr'); if (e) { e.hidden = false; e.parentNode.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    return;
  }
  var main = BLOKI[prof()].main;
  var visibleBools = [];
  if (main.indexOf('objawyTop') >= 0) visibleBools = visibleBools.concat(TOP[prof()]);
  Object.keys(SYMPT).concat(['pominiety_posilek', 'alkohol', 'wysilek']).forEach(function (k) {
    if (ep[k] !== true) ep[k] = visibleBools.indexOf(k) >= 0 ? false : '';
  });
  if (!(num(ep.kawa_ile) > 0) && !(num(ep.herbata_ile) > 0)) ep.kofeina_ostatnia = '';
  if (ep.start_utc && Date.now() - new Date(ep.start_utc).getTime() > 6 * 3600000 && F.isNew) { ep.lat = ''; ep.lon = ''; ep.miasto = ''; }
  var st = epStart(ep), en = epEnd(ep);
  if (st && en && en < st) { toast('Koniec bólu jest przed początkiem. Popraw godzinę.'); return; }
  queue('saveEpisode', JSON.parse(JSON.stringify(ep)));
  LS.del('draft');
  F = null;
  toast('Zapisano');
  nav('home');
}

function dayMap() {
  var m = {};
  function g(k) { return m[k] || (m[k] = { max: null, n: 0, meds: [], tryp: false, zl: false, pr: false, para: 0 }); }
  cache.epizody.forEach(function (e) {
    var s = String(e.start_lokalny).slice(0, 10);
    if (!s) return;
    var en = String(e.koniec_lokalny || '').slice(0, 10) || s;
    var d = s, guard = 0;
    while (d <= en && guard++ < 14) {
      var x = g(d);
      if (d === s) x.n++;
      var n = num(e.natezenie_max);
      if (n !== null && (x.max === null || n > x.max)) x.max = n;
      if (x.max === null) x.max = 0;
      d = addDays(d, 1);

  if (tab) { nav(tab.dataset.tab); return; }
  var reg = ev.target.closest('#mapa .r');
  if (reg && F) {
    var id = reg.dataset.id, sel = selMap();
    if (sel[id]) delete sel[id]; else sel[id] = true;
    F.ep.lokalizacja = Object.keys(REG).filter(function (k) { return sel[k]; }).join(';');
    saveDraft(); rerender('mapa'); return;
  }
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var a = el.dataset.act, v = el.dataset.v, f = el.dataset.f;
  var A = {
    back: function () { if (view.name === 'form' && F && F.isNew) saveDraft(); B = null; E = null; nav(el.dataset.to || 'home'); },
    go: function () { if (el.dataset.to === 'bp') B = null; if (el.dataset.to === 'event') E = null; nav(el.dataset.to); },
    sync: function () { sync.err = null; doSync(); },
    skala: function () { try { localStorage.setItem('skala', String(Number(v))); } catch (e) {} applySkala(); render(); },
    cfgSave: function () {
      var c = decodeCfg($('#cfgIn').value);
      if (!c) { $('#cfgErr').hidden = false; return; }
      cfg = c; LS.set('cfg', cfg); nav('home'); doSync();
    },
    unlink: function () {
      if (!view.unlinkConfirm) { view.unlinkConfirm = true; render(); return; }
      LS.del('cfg'); LS.del('cache'); LS.del('outbox'); LS.del('draft'); cfg = null; cache = null; outbox = []; nav('setup');
    },
    newEp: function () { newEpisode(!!el.dataset.back); },
    editEp: function () { editEpisode(el.dataset.id); },
    discardDraft: function () { LS.del('draft'); newEpisode(F && F.back); },
    single: function () { F.ep[f] = F.ep[f] === v ? '' : v; saveDraft(); rerender(el.closest('[data-blk]').dataset.blk); },
    multi: function () {
      var on = multiVals(f), i = on.indexOf(v), excl = WYKLUCZA[f] || [];
      if (i >= 0) on.splice(i, 1);
      else if (excl.indexOf(v) >= 0) on = [v];
      else { on = on.filter(function (x) { return excl.indexOf(x) < 0; }); on.push(v); }
      F.ep[f] = on.join('; '); saveDraft(); rerender(el.closest('[data-blk]').dataset.blk);
    },
    clearCafTime: function () { F.ep.kofeina_ostatnia = ''; saveDraft(); rerender('kofeina'); },
    bool: function () { F.ep[f] = F.ep[f] === true ? false : true; saveDraft(); el.classList.toggle('on', F.ep[f] === true); },
    step: function () {
      var c = STEP[f], cur = num(F.ep[f]);
      var d = Number(el.dataset.d);
      var nv = cur === null ? (d > 0 ? c.start : '') : (d < 0 && cur <= c.min ? '' : Math.max(c.min, Math.min(c.max, cur + d * c.step)));
      F.ep[f] = nv; saveDraft(); rerender(el.closest('[data-blk]').dataset.blk);
    },
    startAgo: function () { setStart(new Date(Date.now() - Number(v) * 60000)); saveDraft(); rerender('czas'); },
    endState: function () { if (v === '1') { if (!F.ep.koniec_lokalny) setEnd(new Date()); } else setEnd(null); saveDraft(); rerender('koniec'); },
    endAgo: function () { setEnd(new Date(Date.now() - Number(v) * 60000)); saveDraft(); rerender('koniec'); },
    mapAll: function () { F.ep.lokalizacja = Object.keys(REG).join(';'); saveDraft(); rerender('mapa'); },
    mapClear: function () { F.ep.lokalizacja = ''; saveDraft(); rerender('mapa'); },
    alarm: function () {
      var on = String(F.ep.objawy_alarmowe || '').split('; ').filter(String);
      var i = on.indexOf(v); if (i >= 0) on.splice(i, 1); else on.push(v);
      F.ep.objawy_alarmowe = on.join('; '); saveDraft(); rerender('alarm');
    },
    medOpen: function () { var n = new Date(); F.med = { id_leku: '', dawka: '', czas_lokalny: localStr(n), czas_utc: n.toISOString(), nat: num(F.ep.natezenie_max) }; rerender('leki'); },
    medCancel: function () { F.med = null; rerender('leki'); },
    medPick: function () {
      F.med.id_leku = el.dataset.id;
      var opts = String((lekById(el.dataset.id) || {}).opcje_dawki || '').split(';').filter(String);
      F.med.dawka = opts.length === 1 ? opts[0] : '';
      rerender('leki');
    },
    medDose: function () { F.med.dawka = v; rerender('leki'); },
    medAgo: function () { var d = new Date(Date.now() - Number(v) * 60000); F.med.czas_lokalny = localStr(d); F.med.czas_utc = d.toISOString(); rerender('leki'); },
    medAdd: function () {
      var m = F.med, lek = lekById(m.id_leku);
      if (!lek || m.dawka === '') { $('#medErr').hidden = false; return; }
      F.ep.leki = F.ep.leki || [];
      F.ep.leki.push({ id: uuid(), id_leku: lek.id_leku, lek: lek.nazwa, kategoria_moh: lek.kategoria_moh, dawka: Number(m.dawka), jednostka: lek.jednostka,
        paracetamol_mg: Math.round(Number(m.dawka) * (Number(lek.paracetamol_mg_na_jednostke) || 0)), czas_lokalny: m.czas_lokalny, czas_utc: m.czas_utc,
        natezenie_przy_przyjeciu: num(m.nat) === null ? '' : m.nat, efekt_2h: '', kolejna_dawka: F.ep.leki.length > 0 });
      F.med = null; saveDraft(); rerender('leki');
    },
    medDel: function () { F.ep.leki.splice(Number(el.dataset.i), 1); saveDraft(); rerender('leki'); },
    medEff: function () { var l = F.ep.leki[Number(el.dataset.i)]; l.efekt_2h = l.efekt_2h === v ? '' : v; saveDraft(); rerender('leki'); },
    saveEp: saveEpisode,
    delEp: function () {
      if (!F.delConfirm) { F.delConfirm = true; el.textContent = 'Na pewno usunąć? Dotknij ponownie'; return; }
      queue('deleteEpisode', { id: F.ep.id }); F = null; toast('Usunięto'); nav('home');
    },
    closeEp: function () {
      var e = cache.epizody.filter(function (x) { return x.id === el.dataset.id; })[0];
      if (!e) return;
      C = { ep: JSON.parse(JSON.stringify(e)) };
      var n = new Date(); C.ep.koniec_lokalny = localStr(n); C.ep.koniec_utc = n.toISOString();
      nav('close');
    },
    closeAgo: function () { var d = new Date(Date.now() - Number(v) * 60000); C.ep.koniec_lokalny = localStr(d); C.ep.koniec_utc = d.toISOString(); $('[data-f="closeEnd"]').value = inputVal(C.ep.koniec_lokalny); },
    closeEff: function () { var l = C.ep.leki[Number(el.dataset.i)]; l.efekt_2h = l.efekt_2h === v ? '' : v; $$('[data-act="closeEff"][data-i="' + el.dataset.i + '"]').forEach(function (b) { b.classList.toggle('on', b.dataset.v === l.efekt_2h); }); },
    closeSave: function () {
      var st = epStart(C.ep), en = epEnd(C.ep);
      if (st && en && en < st) { toast('Koniec jest przed początkiem bólu.'); return; }
      queue('saveEpisode', C.ep); C = null; toast('Zapisano'); nav('home');
    },
    evalEff: function () {
      var e = cache.epizody.filter(function (x) { return x.id === el.dataset.ep; })[0];
      if (!e) return;
      var c = JSON.parse(JSON.stringify(e));
      c.leki.forEach(function (l) { if (l.id === el.dataset.l) l.efekt_2h = v; });
      queue('saveEpisode', c); toast('Zapisano'); render();
    },
    bpAgo: function () { var d = new Date(Date.now() - Number(v) * 60000); B.czas_lokalny = localStr(d); B.czas_utc = d.toISOString(); $('[data-f="bpTime"]').value = inputVal(B.czas_lokalny); },
    bpCtx: function () { B.kontekst = B.kontekst === v ? '' : v; $$('[data-act="bpCtx"]').forEach(function (b) { b.classList.toggle('on', b.dataset.v === B.kontekst); }); },
    bpSave: function () {
      var sk = num(B.skurczowe), rk = num(B.rozkurczowe), tt = num(B.tetno), err = '';
      if (sk === null || sk < 60 || sk > 260) err = 'Wpisz górne ciśnienie (60–260).';
      else if (rk === null || rk < 30 || rk > 160) err = 'Wpisz dolne ciśnienie (30–160).';
      else if (tt !== null && (tt < 25 || tt > 220)) err = 'Tętno wygląda nieprawidłowo (25–220).';
      if (err) { var e2 = $('#bpErr'); e2.textContent = err; e2.hidden = false; return; }
      B.skurczowe = sk; B.rozkurczowe = rk; B.tetno = tt === null ? '' : tt;
      queue('saveBp', B); B = null; toast('Zapisano pomiar'); nav('home');
    },
    delBp: function () { queue('deleteBp', { id: el.dataset.id }); toast('Usunięto'); render(); },
    evType: function () { E.typ = v; $$('[data-act="evType"]').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); }); $('#evErr').hidden = true; },
    evLek: function () { E.id_leku = v; $$('[data-act="evLek"]').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); }); },
    evSave: function () {
      if (!E.typ) { $('#evErr').hidden = false; return; }
      var l = lekById(E.id_leku); E.lek = l ? l.nazwa : '';
      queue('saveEvent', E); E = null; toast('Zapisano'); nav('more');
    },
    delEv: function () { queue('deleteEvent', { id: el.dataset.id }); toast('Usunięto'); render(); },
    period: function () { view.period = Number(v); render(); }
  };
  if (A[a]) A[a]();
});
document.addEventListener('change', function (ev) {
  var el = ev.target, f = el.dataset && el.dataset.f;
  if (!f) return;
  var d = fromLocal(el.value);
  if (f === 'start' && d) { setStart(d); saveDraft(); rerender('czas'); }
  else if (f === 'end' && d) { setEnd(d); saveDraft(); }
  else if (f === 'medTime' && d && F.med) { F.med.czas_lokalny = localStr(d); F.med.czas_utc = d.toISOString(); }
  else if (f === 'kofeina_ostatnia') { F.ep.kofeina_ostatnia = el.value; saveDraft(); }
  else if (f === 'closeEnd' && d) { C.ep.koniec_lokalny = localStr(d); C.ep.koniec_utc = d.toISOString(); }
  else if (f === 'bpTime' && d) { B.czas_lokalny = localStr(d); B.czas_utc = d.toISOString(); }
  else if (f === 'evDate') { E.data = el.value; }
});
document.addEventListener('input', function (ev) {
  var el = ev.target, f = el.dataset && el.dataset.f;
  if (!f) return;
  if (f === 'uwagi' && F) { F.ep.uwagi = el.value; saveDraft(); }
  else if ((f === 'skurczowe' || f === 'rozkurczowe' || f === 'tetno') && B) { B[f] = el.value; var e = $('#bpErr'); if (e) e.hidden = true; }
  else if (f === 'bpUwagi' && B) B.uwagi = el.value;
  else if (f === 'evDawka' && E) E.dawka = el.value;
  else if (f === 'evSz' && E) E.szczegoly = el.value;
});

// ------------------------------------------------------------ start
window.addEventListener('online', function () { sync.err = null; doSync(); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && cfg && ['home', 'history', 'stats', 'more'].indexOf(view.name) >= 0) doSync(); });
setInterval(function () { if (outbox.length && cfg) doSync(); }, 60000);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
render();
if (cfg) doSync();
</script>
